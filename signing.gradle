def ksFile = rootProject.file('signing.properties')
def props = new Properties()

if (ksFile.canRead()) {
    ksFile.withInputStream { props.load(it) }

    def requiredKeys = [
            'KEYSTORE_FILE',
            'KEYSTORE_PASSWORD',
            'KEYSTORE_ALIAS',
            'KEYSTORE_ALIAS_PASSWORD'
    ]
    def missingKeys = requiredKeys.findAll { key -> !props.containsKey(key) }
    if (!missingKeys.isEmpty()) {
        throw new GradleException("signing.properties missing required keys: ${missingKeys.join(', ')}")
    }

    def keyStorePath = props.getProperty('KEYSTORE_FILE')
    def keyAlias = props.getProperty('KEYSTORE_ALIAS')
    if (keyStorePath == null || keyStorePath.trim().isEmpty()) {
        throw new GradleException("KEYSTORE_FILE must not be empty")
    }
    if (keyAlias == null || keyAlias.trim().isEmpty()) {
        throw new GradleException("KEYSTORE_ALIAS must not be empty")
    }

    def storeFile = file(keyStorePath)
    if (!storeFile.isFile()) {
        throw new GradleException("Keystore file does not exist: ${storeFile}")
    }

    android.signingConfigs.sign.storeFile storeFile
    android.signingConfigs.sign.storePassword props.getProperty('KEYSTORE_PASSWORD')
    android.signingConfigs.sign.keyAlias keyAlias
    android.signingConfigs.sign.keyPassword props.getProperty('KEYSTORE_ALIAS_PASSWORD')
} else {
    android.signingConfigs.sign.storeFile = android.signingConfigs.debug.storeFile
    android.signingConfigs.sign.storePassword = android.signingConfigs.debug.storePassword
    android.signingConfigs.sign.keyAlias = android.signingConfigs.debug.keyAlias
    android.signingConfigs.sign.keyPassword = android.signingConfigs.debug.keyPassword
}
